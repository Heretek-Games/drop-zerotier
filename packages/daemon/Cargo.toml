[package]
name = "drop-zerotier-daemon"
version = "0.1.0"
edition = "2024"
authors = ["Heretek Games"]
description = "ZeroTier client daemon manager and CLI runner for Drop"
license = "MIT"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
