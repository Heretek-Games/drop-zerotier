name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # CI checks out only this repo, so the lockfile must resolve the SDK from
      # the registry. A linked "../drop-plugin-sdk" entry creates a dangling
      # symlink and tsc fails with TS2307 across the addons.
      - name: Verify @droposs/plugin-sdk resolves from the npm registry
        run: |
          npm ls @droposs/plugin-sdk --workspaces
          node -e '
          const { readFileSync } = require("node:fs");
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const entry = lock.packages["node_modules/@droposs/plugin-sdk"];
          if (!entry) throw new Error("@droposs/plugin-sdk is missing from package-lock.json");
          if (entry.link === true) throw new Error("@droposs/plugin-sdk is a linked local package in package-lock.json");
          if (!entry.resolved || !entry.resolved.startsWith("https://registry.npmjs.org/")) {
            throw new Error("@droposs/plugin-sdk does not resolve to the npm registry: " + entry.resolved);
          }
          if (!entry.integrity) throw new Error("@droposs/plugin-sdk lock entry has no integrity hash");
          console.log("@droposs/plugin-sdk@" + entry.version + " -> " + entry.resolved);
          '

      # mesh-core must be built first: the addons import its emitted types.
      - run: npm run build -w @heretek-games/zerotier-mesh
      - run: npm run build
      - run: npm test
      - run: npm run lint

      - run: npm run bundle:build
      - run: npm run validate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: drop-zerotier-plugin
          path: plugin-bundle/
          if-no-files-found: error
