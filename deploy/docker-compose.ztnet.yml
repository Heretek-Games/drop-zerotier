# Optional override for the default Drop stack: adds a self-hosted ZeroTier
# controller managed by ZTNET for the drop-gse multiplayer plugin.
#
# Usage (from this directory):
#   cp .env.ztnet.example .env.ztnet   # then edit it
#   docker compose -f compose.yml -f compose.ztnet.yaml --env-file .env.ztnet up -d
#
# Scope: drop-gse is optional. This file is not referenced by the default
# compose.yml, so a normal Drop deployment is unaffected.
#
# One-time bootstrap (ZTNET UI at http://localhost:3001):
#   1. Register the first user (this account becomes the ZTNET admin).
#   2. Create an Organization and copy its id.
#   3. Mint an Organization API token from your account settings.
#   4. Put the org id/token in .env.ztnet (GSE_ZTNET_ORG / GSE_ZTNET_TOKEN) and
#      re-run the command above so the `drop` service picks them up.
services:
  drop:
    environment:
      - GSE_MESH_BACKEND=ztnet
      - GSE_ZTNET_URL=http://ztnet:3000
      - GSE_ZTNET_ORG=${GSE_ZTNET_ORG:?set GSE_ZTNET_ORG in .env.ztnet}
      - GSE_ZTNET_TOKEN=${GSE_ZTNET_TOKEN:?set GSE_ZTNET_TOKEN in .env.ztnet}

  # ZeroTier controller (the data plane). ZTNET manages this instance via the
  # shared volume; clients join the per-room networks directly.
  zerotier:
    image: zyclonite/zerotier:latest
    container_name: drop-zerotier
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier:/var/lib/zerotier-one
    environment:
      - ZT_OVERRIDE_LOCAL_CONF=true
      # Permit management from the compose network (see the `default` network
      # subnet below).
      - ZT_ALLOW_MANAGEMENT_FROM=172.31.255.0/24
    ports:
      - "9993:9993/udp"

  # ZTNET's own database (separate from Drop's).
  # Pinned: the `postgres:alpine` tag is now v18, whose entrypoint expects the
  # data directory at /var/lib/postgresql (not .../data). ZTNET documents v15.
  ztnet-postgres:
    image: postgres:15-alpine
    container_name: drop-ztnet-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ztnet
    volumes:
      - ztnet-db:/var/lib/postgresql/data

  # ZTNET admin UI + org REST API consumed by the drop-gse plugin.
  ztnet:
    image: sinamics/ztnet:latest
    container_name: drop-ztnet
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - ztnet-postgres
      - zerotier
    volumes:
      - zerotier:/var/lib/zerotier-one
    ports:
      # Published on 3001 so it does not clash with Drop on 3000.
      - "3001:3000"
    environment:
      POSTGRES_HOST: ztnet-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztnet
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_URL_INTERNAL: http://ztnet:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env.ztnet}
      # Controller address; without this ZTNET reports a null controller.
      ZT_ADDR: http://zerotier:9993
      # ZT_SECRET defaults to the shared volume's authtoken.secret. Uncomment
      # and set it if the container cannot read that file:
      # ZT_SECRET: ${ZT_SECRET}
      # Room teardown can burst beyond the 50/min default.
      RATE_LIMIT_API_MAX_REQUESTS: 500

volumes:
  zerotier:
  ztnet-db:

# Pin the shared compose network so ZT_ALLOW_MANAGEMENT_FROM is stable.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/24
